# 02 — The deployment. ONE service: the HTTP API, the Kafka consumer and the minutes writer
# (Llama 3.3 70B on IBM watsonx, IBM Cloud us-south) all run in this single pod.
# Apply 01-secret.yaml first.
# Replace CHANGE_ME_REGISTRY (image) before applying.
#
# Before the first deploy, create these Kafka topics (1 partition, replication 1):
#   mom-prompt.jobs
#   mom-prompt.acks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mom-prompt-service
  namespace: trino
  labels:
    app: mom-prompt-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mom-prompt-service
  template:
    metadata:
      labels:
        app: mom-prompt-service
    spec:
      terminationGracePeriodSeconds: 3600
      containers:
        - name: mom-prompt-service
          image: CHANGE_ME_REGISTRY/mom-prompt-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # ── service ──
            - name: JOB_KIND
              value: "prompt"
            - name: ENABLE_KAFKA
              value: "true"
            # ── Kafka ──
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service.teamsync.svc.cluster.local:9092"
            - name: KAFKA_JOB_TOPIC
              value: "mom-prompt.jobs"
            - name: KAFKA_ACK_TOPIC
              value: "mom-prompt.acks"
            - name: KAFKA_GROUP_ID
              value: "mom-prompt-consumer"
            # ── MinIO ──
            - name: MINIO_ENDPOINT
              value: "minio-service.teamsync.svc.cluster.local:9000"
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_SUMMARY_BUCKET
              value: "mom"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mom-prompt-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mom-prompt-secrets
                  key: MINIO_SECRET_KEY
            # ── Elasticsearch ──
            - name: ELASTIC_URL
              value: "http://elasticsearch-service.teamsync.svc.cluster.local:9200"
            - name: ELASTIC_INDEX_ATTACHED
              value: "mom-attached"
            - name: ENABLE_CHUNK_INDEX
              value: "true"
            - name: CHUNK_INDEX
              value: "mom_v1"
            - name: ELASTIC_USER
              valueFrom:
                secretKeyRef:
                  name: mom-prompt-secrets
                  key: ELASTIC_USER
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mom-prompt-secrets
                  key: ELASTIC_PASSWORD
            # ── minutes writer (runs inside this pod) — IBM watsonx on IBM Cloud (us-south) ──
            # NOT Cloud Pak for Data: cpd-watsonx-imir.apps.ocp4.iaf.in does not resolve from this
            # cluster ("Name or service not known"). Set LLM_AUTH_MODE exactly ONCE — a second, empty
            # LLM_AUTH_MODE overrides the first and the auth mode is guessed.
            - name: APP_MODE
              value: "online"
            - name: VLLM_API_BASE
              value: "https://us-south.ml.cloud.ibm.com/ml/v1/text/chat?version=2023-05-29"
            - name: LLM_MODEL_PATH
              value: "meta-llama/llama-3-3-70b-instruct"
            - name: WATSONX_PROJECT_ID
              value: "7ade6186-5397-4ed2-99f7-dce2cc6eda66"
            - name: LLM_AUTH_MODE
              value: "iam"
            - name: LLM_VERIFY_SSL
              value: "true"
            - name: LLM_PROVIDER_ORDER
              value: ""
            - name: LLM_IS_REASONING
              value: "false"
            - name: MODEL_CONTEXT_LIMIT
              value: "32768"
            - name: LLM_CONCURRENCY
              value: "2"
            - name: MOM_WINDOW_KEY_POINTS
              value: "true"
            - name: WATSONX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mom-prompt-secrets
                  key: WATSONX_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
