# 01 — The deployment. ONE service: the HTTP API, the Kafka consumer and the minutes writer
# (Llama 3.3 70B on IBM watsonx, IBM Cloud us-south) all run in this single pod.
# Every setting is a plain environment value — no Secret object. Replace each CHANGE_ME with the real
# value before applying; never commit the filled copy.
#
# Before the first deploy, create these Kafka topics (1 partition, replication 1):
#   mom-prompt.jobs
#   mom-prompt.acks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mom-prompt-service
  namespace: mom-ai
  labels:
    app: mom-prompt-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mom-prompt-service
  template:
    metadata:
      labels:
        app: mom-prompt-service
    spec:
      terminationGracePeriodSeconds: 3600
      # Lets OpenShift pull the image from the private registry. NOT an environment secret — without it
      # the pod cannot start (ImagePullBackOff).
      imagePullSecrets:
        - name: dockerocp-secret
      containers:
        - name: mom-prompt-service
          image: bajpai92/repo:mom-prompt-service6     # the tag Jenkins last pushed
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # ── service ──
            - name: JOB_KIND
              value: "prompt"
            - name: ENABLE_KAFKA
              value: "true"
            # ── Kafka ──
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service.teamsync.svc.cluster.local:9092"
            - name: KAFKA_JOB_TOPIC
              value: "mom-prompt.jobs"
            - name: KAFKA_ACK_TOPIC
              value: "mom-prompt.acks"
            - name: KAFKA_GROUP_ID
              value: "mom-prompt-consumer"
            # The ack's `message` on failure (SUCCESS on success). The IMIR backend reads FAILED.
            - name: ACK_FAILURE_MESSAGE
              value: "FAILED"
            # A job sent over HTTP also puts its ack on mom-prompt.acks, where the backend listens.
            - name: HTTP_ACKS_TO_KAFKA
              value: "true"
            # ── MinIO ──
            - name: MINIO_ENDPOINT
              value: "minio-service.teamsync.svc.cluster.local:9000"
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_SUMMARY_BUCKET
              value: "mom"
            - name: MINIO_ACCESS_KEY
              value: "CHANGE_ME"
            - name: MINIO_SECRET_KEY
              value: "CHANGE_ME"
            # ── Elasticsearch ──
            - name: ELASTIC_URL
              value: "http://elasticsearch-service.teamsync.svc.cluster.local:9200"
            - name: ELASTIC_INDEX_ATTACHED
              value: "mom-attached"
            - name: ENABLE_CHUNK_INDEX
              value: "true"
            - name: CHUNK_INDEX
              value: "mom_v1"
            # The platform's repository index (checked in Kibana). A file picked "From repository" is read
            # from its chunks here, by fId; an attached file is read from MinIO. Read-only.
            - name: REPOSITORY_INDEX
              value: "teamsync_v1"
            - name: ELASTIC_USER
              value: "CHANGE_ME"
            - name: ELASTIC_PASSWORD
              value: "CHANGE_ME"
            # ── OCR for scanned PDF pages: Tesseract, inside this pod ──
            # Used only on a PDF page with no text of its own (a scan). Check what is in force at /health.
            # "false" skips scanned pages; a PDF that is only scans then fails with a sentence saying so.
            - name: ENABLE_OCR
              value: "true"
            # Languages, English FIRST: "hin+eng" loses the digit 1 ("16 Sep" read "6 Sep"). Installed: eng, hin.
            # "eng+hin", "eng,hin" and "eng hin" all work. Only English: "eng".
            - name: OCR_LANGS
              value: "eng+hin"
            # Resolution a scanned page is read at. Below 300, Hindi vowel signs drop out.
            - name: OCR_DPI
              value: "300"
            # Most scanned pages read per document; 0 = every page (a number skips the pages after it).
            - name: OCR_MAX_PAGES
              value: "0"
            # Scanned pages read at the same time (one CPU core each; see requests.cpu). Same text, faster.
            - name: OCR_WORKERS
              value: "4"
            # A page with fewer characters of its own text than this is treated as a scan.
            - name: MIN_PAGE_TEXT_CHARS
              value: "40"
            # ── minutes writer (runs inside this pod) — IBM watsonx on IBM Cloud (us-south) ──
            # NOT Cloud Pak for Data: cpd-watsonx-imir.apps.ocp4.iaf.in does not resolve from this
            # cluster ("Name or service not known"). Set LLM_AUTH_MODE exactly ONCE — a second, empty
            # LLM_AUTH_MODE overrides the first and the auth mode is guessed.
            - name: APP_MODE
              value: "online"
            - name: VLLM_API_BASE
              value: "https://us-south.ml.cloud.ibm.com/ml/v1/text/chat?version=2023-05-29"
            - name: LLM_MODEL_PATH
              value: "meta-llama/llama-3-3-70b-instruct"
            - name: WATSONX_PROJECT_ID
              value: "7ade6186-5397-4ed2-99f7-dce2cc6eda66"
            - name: LLM_AUTH_MODE
              value: "iam"
            - name: LLM_VERIFY_SSL
              value: "true"
            - name: LLM_PROVIDER_ORDER
              value: ""
            - name: LLM_IS_REASONING
              value: "false"
            # How much the model may read in ONE call. Up to this, the main read takes the whole transcript
            # in one call; above it, the transcript is split into parts plus a merge call (a 3-hour meeting
            # at 32768: 10 parts + 1 merge; at 65536: 1 call). IBM Cloud's Llama 3.3 70B takes 128k and
            # this cluster has already made 48k-token calls. On CP4D, confirm its model's limit first.
            - name: MODEL_CONTEXT_LIMIT
              value: "65536"
            # Model calls in flight at once, for the whole pod. IBM allows 8 requests a SECOND (Essentials/Standard)
            # and each call takes seconds, so 8 in flight is well inside it. Same questions, same answers — faster.
            - name: LLM_CONCURRENCY
              value: "8"
            - name: MOM_WINDOW_KEY_POINTS
              value: "true"
            # CHUNK SIZE: characters of transcript per window call. Decides most of a job's model calls:
            # 1800 (~half a page) = 25 calls for a 45-min meeting, 141 for 3 hours; 6000 (~2 pages) = 12 and
            # 39. Smaller catches more small details. 1800 until a full test shows 6000 loses nothing.
            - name: MOM_WINDOW_CHARS
              value: "1800"
            # Shortening: at most this many discussion points per ITEM. "0" = OFF, every verified point is
            # printed — accuracy first, however long the minutes. A number >0 deletes real points.
            - name: ESSENCE_POINTS_PER_ITEM
              value: "0"
            - name: WATSONX_API_KEY
              value: "CHANGE_ME"
          resources:
            requests:
              cpu: "2"              # OCR_WORKERS scanned pages at once need their cores; was 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
