# 01 — Credentials for both mom-prompt deployments.
# Replace every CHANGE_ME before applying. Never commit the filled copy.
apiVersion: v1
kind: Secret
metadata:
  name: mom-prompt-secrets
  namespace: trino
type: Opaque
stringData:
  # MinIO — used by mom-prompt-service
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  # Elasticsearch — used by mom-prompt-service
  ELASTIC_USER: "CHANGE_ME"
  ELASTIC_PASSWORD: "CHANGE_ME"
  # IBM watsonx (Cloud Pak for Data) — used by mom-prompt-llama
  CP4D_USERNAME: "CHANGE_ME"
  CP4D_API_KEY: "CHANGE_ME"
