# 01 — Credentials for mom-prompt-service.
# Replace every CHANGE_ME before applying. Never commit the filled copy.
apiVersion: v1
kind: Secret
metadata:
  name: mom-prompt-secrets
  namespace: trino
type: Opaque
stringData:
  # MinIO
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  # Elasticsearch
  ELASTIC_USER: "CHANGE_ME"
  ELASTIC_PASSWORD: "CHANGE_ME"
  # IBM watsonx (IBM Cloud) API key — the minutes writer. Paste it as text; never retype it from a
  # screenshot (lowercase l and capital I look identical, and IBM then answers BXNIM0415E).
  WATSONX_API_KEY: "CHANGE_ME"
