# 03 — Services for both deployments.
---
apiVersion: v1
kind: Service
metadata:
  name: mom-prompt-llama
  namespace: trino
  labels:
    app: mom-prompt-llama
spec:
  selector:
    app: mom-prompt-llama
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: mom-prompt-service
  namespace: trino
  labels:
    app: mom-prompt-service
spec:
  selector:
    app: mom-prompt-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
